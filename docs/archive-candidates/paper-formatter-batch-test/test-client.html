<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Formatter</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 0 auto; padding: 24px; background: #f5f5f5; }
  h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .sub { color: #666; font-size: 0.82rem; margin-bottom: 16px; }

  .pipeline { display: flex; gap: 0; align-items: center; margin-bottom: 16px; }
  .pipe-step { padding: 4px 14px; font-size: 0.78rem; border-radius: 12px; background: #e5e7eb; color: #9ca3af; }
  .pipe-step.done { background: #dcfce7; color: #16a34a; }
  .pipe-step.active { background: #4E41FF; color: #fff; }
  .pipe-arrow { color: #d1d5db; font-size: 0.7rem; margin: 0 2px; }

  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .drop-zone {
    border: 2px dashed #d1d5db; border-radius: 8px; padding: 32px;
    text-align: center; cursor: pointer; transition: all .15s;
    background: #fafafa;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: #4E41FF; background: #f5f3ff; }
  .drop-zone.done { border-color: #16a34a; background: #f0fdf4; }
  .drop-zone .icon { font-size: 2rem; margin-bottom: 6px; }
  .drop-zone .hint { color: #6b7280; font-size: 0.85rem; }
  .drop-zone .hint strong { color: #4E41FF; }

  .status-line { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.82rem; color: #6b7280; }
  .status-line .spinner { width: 14px; height: 14px; border: 2px solid #e5e7eb; border-top-color: #4E41FF; border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
  .status-line .check { color: #16a34a; font-weight: bold; }
  .status-line .cross { color: #dc2626; font-weight: bold; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .result-item { padding: 6px 10px; border-radius: 6px; background: #f9fafb; font-size: 0.8rem; display: flex; justify-content: space-between; }
  .result-item .conf { font-weight: 600; }
  .result-item .conf.high { color: #16a34a; }
  .result-item .conf.med { color: #d97706; }

  .btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: #4E41FF; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #3b35e0; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover:not(:disabled) { background: #15803d; }

  .hidden { display: none; }
</style>
</head>
<body>

<h1>论文格式助手</h1>
<div class="sub">上传 DOCX → 自动分析 → 自动格式化</div>

<div class="pipeline">
  <span class="pipe-step" id="ps1">上传</span>
  <span class="pipe-arrow">→</span>
  <span class="pipe-step" id="ps2">分析</span>
  <span class="pipe-arrow">→</span>
  <span class="pipe-step" id="ps3">格式化</span>
  <span class="pipe-arrow">→</span>
  <span class="pipe-step" id="ps4">完成</span>
</div>

<!-- Upload Area -->
<div class="card">
  <div class="drop-zone" id="dropZone">
    <div class="icon">📄</div>
    <div class="hint">点击选择或拖拽 <strong>.docx</strong> 文件到此处</div>
    <input type="file" id="fileInput" accept=".docx" style="display:none">
  </div>
</div>

<!-- Status -->
<div class="card" id="statusCard">
  <div id="statusList"></div>
</div>

<!-- Profile selector (shown after analysis) -->
<div class="card hidden" id="profileCard">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:0.85rem;font-weight:600">格式配置</div>
      <div style="font-size:0.78rem;color:#6b7280" id="profileName">tsinghua_2026</div>
    </div>
    <button class="btn btn-primary" id="btnFormat" onclick="startFormat()">开始格式化</button>
  </div>
</div>

<!-- Result -->
<div class="card hidden" id="resultCard">
  <div id="resultContent"></div>
</div>

<script>
const API = 'http://localhost:4000/api/v1';
let state = { docId: null, filename: '', jobAnalyze: null, jobFormat: null };
let autoRun = false;

// ── Drop zone ──
const dz = document.getElementById('dropZone');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', () => fi.click());
fi.addEventListener('change', () => { if (fi.files[0]) startPipeline(fi.files[0]); });
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files[0]) startPipeline(e.dataTransfer.files[0]); });

function setPipeStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('ps' + i);
    el.className = 'pipe-step' + (i < n ? ' done' : '') + (i === n ? ' active' : '');
  }
}

function addStatus(msg, type) {
  const list = document.getElementById('statusList');
  const icon = type === 'ok' ? '<span class="check">✓</span>'
    : type === 'err' ? '<span class="cross">✗</span>'
    : type === 'active' ? '<span class="spinner"></span>'
    : '<span style="color:#9ca3af">○</span>';
  list.innerHTML += `<div class="status-line">${icon} ${msg}</div>`;
  list.scrollTop = list.scrollHeight;
}

function replaceLastStatus(msg, type) {
  const list = document.getElementById('statusList');
  const last = list.lastElementChild;
  if (last) {
    const icon = type === 'ok' ? '<span class="check">✓</span>'
      : type === 'err' ? '<span class="cross">✗</span>'
      : type === 'active' ? '<span class="spinner"></span>'
      : '<span style="color:#9ca3af">○</span>';
    last.innerHTML = `${icon} ${msg}`;
  }
}

// ── Pipeline: single entry point after file select ──
async function startPipeline(file) {
  if (autoRun) return;
  autoRun = true;

  state.filename = file.name;
  dz.querySelector('.hint').textContent = file.name;
  dz.classList.add('done');
  dz.style.cursor = 'default';

  await upload(file);
}

async function upload(file) {
  setPipeStep(1);
  addStatus('上传 ' + file.name + ' …', 'active');

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch(`${API}/documents`, { method: 'POST', body: form });
    const data = await res.json();
    state.docId = data.docId;
    replaceLastStatus('上传完成: ' + data.docId, 'ok');
    setPipeStep(2);
    await analyze();
  } catch (e) {
    replaceLastStatus('上传失败: ' + e.message, 'err');
    autoRun = false;
  }
}

async function analyze() {
  addStatus('分析文档结构 …', 'active');

  try {
    const res = await fetch(`${API}/jobs/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ docId: state.docId, profileId: 'tsinghua_2026' })
    });
    const data = await res.json();
    state.jobAnalyze = data.jobId;
    addStatus('分析任务: ' + data.jobId, '');

    // Poll
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 800));
      const jres = await fetch(`${API}/jobs/${data.jobId}`);
      const jdata = await jres.json();

      if (jdata.status === 'completed') {
        replaceLastStatus('分析完成', 'ok');
        showAnalysisResult(jdata);
        setPipeStep(3);
        return;
      } else if (jdata.status === 'failed') {
        replaceLastStatus('分析失败: ' + (jdata.error_message || '解析器错误'), 'err');
        autoRun = false;
        return;
      }
    }
    replaceLastStatus('分析超时', 'err');
    autoRun = false;
  } catch (e) {
    replaceLastStatus('分析请求失败: ' + e.message, 'err');
    autoRun = false;
  }
}

function showAnalysisResult(jdata) {
  const r = jdata.result || {};
  const items = r.items || [];

  let html = '<div class="result-grid">';
  for (const item of items) {
    const cls = item.conf >= 0.85 ? 'high' : 'med';
    html += `<div class="result-item"><span>${item.k}</span><span class="conf ${cls}">${(item.conf*100).toFixed(0)}%</span></div>`;
  }
  html += '</div>';

  document.getElementById('profileName').textContent = 'tsinghua_2026 · 检测项 ' + items.length;
  document.getElementById('profileCard').classList.remove('hidden');
}

async function startFormat() {
  const btn = document.getElementById('btnFormat');
  btn.disabled = true; btn.textContent = '格式化中…';
  addStatus('格式化文档 …', 'active');

  try {
    const res = await fetch(`${API}/jobs/format`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ docId: state.docId, profileId: 'tsinghua_2026' })
    });
    const data = await res.json();
    state.jobFormat = data.jobId;

    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 800));
      const jres = await fetch(`${API}/jobs/${data.jobId}`);
      const jdata = await jres.json();

      if (jdata.status === 'completed') {
        replaceLastStatus('格式化完成', 'ok');
        showResult(jdata);
        setPipeStep(4);
        return;
      } else if (jdata.status === 'failed') {
        replaceLastStatus('格式化失败: ' + (jdata.error_message || ''), 'err');
        btn.disabled = false; btn.textContent = '重新格式化';
        return;
      }
    }
    replaceLastStatus('格式化超时', 'err');
    btn.disabled = false; btn.textContent = '重新格式化';
  } catch (e) {
    replaceLastStatus('格式化请求失败: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '重新格式化';
  }
}

function showResult(jdata) {
  const r = jdata.result || {};
  const summary = r.summary || {};

  document.getElementById('profileCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');

  document.getElementById('resultContent').innerHTML = `
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:2rem;margin-bottom:4px">✅</div>
      <div style="font-weight:600">${summary.changeCount || 0} 处格式变更</div>
      <div style="font-size:0.8rem;color:#6b7280">${summary.pages || 0} 页 · 格式 ${summary.formatChanges || 0}</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-success" onclick="downloadDocx()">📥 下载 DOCX</button>
      <button class="btn btn-primary" onclick="downloadAgain()" style="background:#6b7280">🔄 重新选择文件</button>
    </div>
  `;
}

async function downloadDocx() {
  addStatus('下载中 …', 'active');
  try {
    const res = await fetch(`${API}/jobs/${state.jobFormat}/download`);
    if (!res.ok) throw new Error(res.statusText);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'formatted_' + state.docId + '.docx';
    a.click(); URL.revokeObjectURL(url);
    replaceLastStatus('下载完成: formatted_' + state.docId + '.docx', 'ok');
  } catch (e) {
    replaceLastStatus('下载失败: ' + e.message, 'err');
  }
}

function downloadAgain() {
  autoRun = false;
  state = { docId: null, filename: '', jobAnalyze: null, jobFormat: null };
  document.getElementById('statusList').innerHTML = '';
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('profileCard').classList.add('hidden');
  document.getElementById('dropZone').querySelector('.hint').textContent = '点击选择或拖拽 .docx 文件到此处';
  document.getElementById('dropZone').classList.remove('done');
  document.getElementById('dropZone').style.cursor = 'pointer';
  document.getElementById('fileInput').value = '';
  for (let i = 1; i <= 4; i++) document.getElementById('ps' + i).className = 'pipe-step';
}
</script>
</body>
</html>
