<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIB AI Agent API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 3rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    .badge {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2rem;
      padding: 12px 16px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
    }
    .endpoints {
      display: grid;
      gap: 8px;
    }
    .endpoint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #1e293b;
      transition: border-color 0.2s;
    }
    .endpoint:hover { border-color: #334155; }
    .method {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: #2563eb20;
      color: #60a5fa;
    }
    .path { font-size: 0.85rem; font-family: 'SF Mono', monospace; color: #94a3b8; }
    .desc { font-size: 0.8rem; color: #64748b; }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #475569;
      text-align: center;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>VIB AI Agent</h1>
    <span class="badge">API Server</span>

    <div class="status-row">
      <div class="dot"></div>
      <span style="font-size:0.9rem;font-weight:600;">运行正常</span>
      <span style="margin-left:auto;font-size:0.8rem;color:#64748b;" id="version">v1.0.0</span>
    </div>

    <div class="endpoints">
      <div class="endpoint">
        <span><span class="method">GET</span> <span class="path">/health</span></span>
        <span class="desc">健康检查</span>
      </div>
      <div class="endpoint">
        <span><span class="method">POST</span> <span class="path">/api/agent</span></span>
        <span class="desc">AI Agent 分析</span>
      </div>
      <div class="endpoint">
        <span><span class="method">GET</span> <span class="path">/api/tasks/:id</span></span>
        <span class="desc">任务状态查询</span>
      </div>
      <div class="endpoint">
        <span><span class="method">GET</span> <span class="path">/api/signals/:id</span></span>
        <span class="desc">信号查询</span>
      </div>
      <div class="endpoint">
        <span><span class="method">GET</span> <span class="path">/api/reports/:id</span></span>
        <span class="desc">报告查询</span>
      </div>
    </div>

    <div class="footer">
      <a href="/health">/health</a> · <a href="https://github.com/haow56782-png/ai-agent-lab">GitHub</a>
    </div>
  </div>

  <script>
    fetch('/health')
      .then(r => r.json())
      .then(d => document.getElementById('version').textContent = 'v' + d.version)
      .catch(() => {});
  </script>
</body>
</html>
