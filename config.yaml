# VIB AI Agent — Configuration
# Env vars override these values (e.g. LLM_TEMPERATURE=0.1)

llm.temperature: 0.7
llm.maxTokens: 4096
llm.model: deepseek-chat
llm.timeoutMs: 30000
llm.retry.max: 3
llm.retry.delayMs: 1000
llm.retry.backoff: 2

agent.maxIterations: 10
agent.replHistorySize: 50

log.level: info
