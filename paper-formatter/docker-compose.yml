services:
  # ── API Gateway ──
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://paper:paper@postgres:5432/paper_formatter
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - FORMATTER_URL=http://formatter:5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── DOCX Formatter (Python) ──
  formatter:
    build:
      context: ./services/formatter
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FORMATTER_PORT=5000
    restart: unless-stopped

  # ── Infrastructure ──
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=paper
      - POSTGRES_PASSWORD=paper
      - POSTGRES_DB=paper_formatter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api-gateway/src/schemas/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_formatter"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio_data:
