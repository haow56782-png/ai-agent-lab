# VIB AI Agent — CI
#
# Runs type checking and unit tests on every push and pull request.
# Integration tests requiring DEEPSEEK_API_KEY are skipped automatically.
#
# Constraints:
#   - No .env reading
#   - No Claude MCP / Ruflo MCP / .claude dependencies
#   - No secrets uploaded

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CI: "true"

  client-visual-baseline:
    name: client visual baseline
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: paper-formatter/services/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: paper-formatter/services/client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Verify fixed visual environment
        run: |
          sw_vers
          node --version
          npm --version
          npx playwright --version
          node -e "const lock=require('./package-lock.json'); console.log('playwright', lock.packages['node_modules/playwright'].version);"
          system_profiler SPFontsDataType | grep -E "PingFang|Songti|Times New Roman|Arial" | head -40 || true

      - name: Typecheck client app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Playwright config
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Build client
        run: npm run build

      - name: Run Step5 visual baseline gate
        run: npm run test:visual -- --reporter=line
        env:
          CI: "true"

      - name: Run client behavior regressions
        run: npm run test:behavior -- --reporter=line
        env:
          CI: "true"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-playwright-artifacts
          path: |
            paper-formatter/services/client/test-results
            paper-formatter/services/client/playwright-report
          if-no-files-found: ignore
