name: Word System Regression

on:
  pull_request:
    paths:
      - "paper-formatter/.claude/skills/word-system-skill/**"
      - ".github/workflows/word-system-regression.yml"
  push:
    branches:
      - main
    paths:
      - "paper-formatter/.claude/skills/word-system-skill/**"
      - ".github/workflows/word-system-regression.yml"

jobs:
  word-system-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-formatter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API Gateway test runtime
        working-directory: paper-formatter/services/api-gateway
        run: npm install

      - name: Run Word System regression
        run: bash .claude/skills/word-system-skill/scripts/run-word-system-regression.sh
